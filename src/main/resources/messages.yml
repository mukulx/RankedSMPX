# MESSAGE FORMAT SUPPORT
# This file supports BOTH legacy color codes AND modern MiniMessage format!
#
# LEGACY FORMAT (Traditional Minecraft):
#   &a = green, &b = aqua, &c = red, &e = yellow, &6 = gold
#   &#FF5555 = hex color (RGB)
#   Example: "&aHello &b&lWorld"
#
# MINIMESSAGE FORMAT (Modern, recommended):
#   <green>text</green>, <aqua>text</aqua>, <red>text</red>
#   <#FF5555>text</#FF5555> = hex color
#   <gradient:#FF0000:#00FF00>text</gradient> = gradient
#   <bold>text</bold>, <italic>text</italic>, <underlined>text</underlined>
#   Example: "<gradient:#FF0000:#00FF00>Rainbow Text</gradient>"
#   Example: "<#FF5555><bold>Bold Red Text</bold></#FF5555>"
#
# SMALL CAPS SUPPORT:
#   Small caps work with BOTH formats! Text inside tags is converted to small caps
#   while preserving all formatting and colors.
#   Example: "<gradient:#FF0000:#00FF00>Hello World</gradient>" → "ʜᴇʟʟᴏ ᴡᴏʀʟᴅ" with gradient
#   Example: "&aHello &bWorld" → "ʜᴇʟʟᴏ ᴡᴏʀʟᴅ" with colors
#   Disable in config.yml: small-caps-messages: false
#
# You can mix both formats in the same file!

