# Role Synchronization
role-sync:
  # Enable automatic role assignment based on ranks
  enabled: false
  # Create roles automatically if they don't exist
  auto-create-roles: true
  # Role name format (use {rank} for rank number)
  role-format: "Rank #{rank}"
  # Unranked role name
  unranked-role: "Unranked"
  # Unranked role ID (auto-set, don't edit unless needed)
  unranked-role-id: ""
  # Rank role IDs (auto-set, don't edit unless needed)
  rank-role-ids: {}
  # Remove old rank roles when rank changes
  remove-old-roles: true
  # Moderator role: given on join / account link to linked players with the
  # rankedsmp.discord.mod permission (leave empty to disable)
  mod-role-id: "" # Discord role ID for moderators (optional)
  # Also take the mod role away from linked players without that permission
  # (off by default so moderators assigned by hand in Discord keep it)
  remove-mod-role-without-permission: false
  # Role colors by rank tier (hex format)
  colors:
    rank-1: "#FFD700"      # Gold
    rank-2-3: "#C0C0C0"    # Silver
    rank-4-10: "#CD7F32"   # Bronze
    rank-11-plus: "#808080" # Gray
    unranked: "#696969"    # Dim Gray

