commands:
  # Enable /help command in Discord
  help: true
  # Enable /rank command in Discord
  rank: true
  # Enable /rankset command in Discord (admin only)
  rankset: true
  # Enable /rankrandom command in Discord (admin only)
  rankrandom: true
  # Enable /setchannel command in Discord (admin only)
  setchannel: true
  # Enable /rankexport command in Discord (admin only)
  rankexport: true
  # Enable /rankimport command in Discord (admin only)
  rankimport: true
  # Enable /link command in Discord
  link: true
  # Enable /unlink command in Discord
  unlink: true

