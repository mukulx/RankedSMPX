# Leaderboard Settings
leaderboard:
  # Enable automatic leaderboard updates
  enabled: true
  # Channel ID for leaderboard (set via /setchannel leaderboard or manually)
  channel-id: ""
  # Message ID of the leaderboard embed (auto-set, don't edit)
  message-id: ""
  # Update interval in seconds (minimum 60)
  update-interval: 300
  # Show unlinked players on leaderboard
  show-unlinked: true
  # Maximum players to show (0 = all)
  max-players: 20
  # Leaderboard title
  title: "🏆 RankedSMP X Leaderboard"
  # Leaderboard color (hex format)
  color: "#00FFFF"

