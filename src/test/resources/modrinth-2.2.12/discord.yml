# Server Updates Channel
updates:
  # Enable server update announcements
  enabled: false
  # Channel ID for updates (set via /setchannel updates or manually)
  channel-id: ""
  # Announce when game starts
  announce-game-start: true
  # Announce when game ends
  announce-game-end: true
  # Announce rank changes (gained, lost, transferred, removed)
  announce-rank-changes: false
  # Announce player join events
  announce-player-join: false
  # Announce player leave events
  announce-player-leave: false
  # Announce player death events
  announce-player-death: false
  # Mention role for important updates
  mention-role-id: ""

