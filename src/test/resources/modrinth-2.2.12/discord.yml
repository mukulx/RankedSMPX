# Rank Notifications (DM players when rank changes)
notifications:
  # Enable DM notifications
  enabled: true
  # Notify when player gains a rank
  notify-on-gain: true
  # Notify when player loses a rank
  notify-on-loss: true
  # Notify when player reaches top 3
  notify-top-3: true
  # Notification color
  color: "#FFD700"

