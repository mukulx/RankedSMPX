# Enable Discord integration (requires bot token and guild ID)
enabled: false

# Config version (do not edit - used for automatic updates)
config-version: 2

# Discord Support Server Invite Link
# This link is shown in the first-time setup message and help messages
discord-invite: "https://discord.gg/QGsJYht2vy"

# Embed Footer Name (appears in all Discord embeds)
# Change this to customize the footer text in all Discord messages
embed-footer-name: "RankedSMPX"

# Discord Bot Configuration
bot:
  # Bot token from https://discord.com/developers/applications
  # Get your bot token: https://discord.com/developers/applications → Your App → Bot → Token
  # Example: "EXAMPLE_TOKEN"
  token: "YOUR_BOT_TOKEN_HERE"
  
  # Your Discord server (guild) ID
  # How to get: Enable Developer Mode in Discord → Right-click your server → Copy Server ID
  # Example: "123456789012345678"
  guild-id: "YOUR_GUILD_ID_HERE"
  
  # Bot activity status
  activity:
    type: "PLAYING" # PLAYING, WATCHING, LISTENING, COMPETING
    message: "RankedSMP X | /rank"
  # Clear previous slash commands before registering new ones
  # Set to true to remove all old commands and register fresh ones
  # Useful when you've changed command configurations or removed commands
  clear-previous-commands: false

