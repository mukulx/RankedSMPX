# Account Linking System
linking:
  # Enable Discord linking system
  enabled: true
  # Require Discord linking to play on the server
  required: false
  # Kick message if linking is required and player is not linked
  # Use {code} placeholder for the linking code
  kick-message: "&cYou must link your Discord account to play!\n&eYour linking code: &b{code}\n&7Use /link {code} in the Discord server to link your account."
  # Show linking reminder on join
  remind-on-join: true
  # Reminder message
  reminder-message: "&e&l[!] &7Link your Discord account with &a/linkdiscord &7for exclusive features!"
  # Code expiration time in minutes
  code-expiration: 10
  # Allow unlinking
  allow-unlink: true

