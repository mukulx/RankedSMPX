# Health System
health:
  # How to apply max health:
  # MODIFIER - Use AttributeModifier (recommended, most compatible with other plugins)
  #            Adds bonus hearts on top of base health. Other plugins can coexist.
  #
  # DIRECT - Use setBaseValue (simpler, may conflict with plugins that also modify health)
  #          Directly sets max health. Works if no other plugins touch health.
  #
  # AGGRESSIVE - Nuclear option. Removes ALL other health modifiers and forces our value.
  #              Periodically re-checks and fixes health if another plugin changes it.
  #              ⚠ WARNING: Only use this when nothing else works!
  #              This mode fights other plugins for control of health values.
  #
  #              To find conflicting plugins:
  #              1. Use PlugMan to unload plugins one by one
  #              2. Test after each unload to find the culprit
  #              3. Common culprits: AltarSMP, poorly coded RPG plugins
  #              4. If you find the plugin, report the conflict to their devs
  #              5. If their code is too bad to fix, use AGGRESSIVE mode as last resort
  mode: MODIFIER

  # Aggressive mode settings (only used when mode is AGGRESSIVE)
  aggressive:
    # How often to force re-check health (in seconds)
    # Lower = more CPU usage but catches changes faster
    recheck-interval: 5
    # Remove other plugins' health modifiers on apply
    # When true: Removes ALL AttributeModifiers except ours
    # When false: Only removes ours and adds it back (less aggressive)
    remove-other-modifiers: true

  # Rank 1 hearts
  max-hearts: 20.0
  # Rank 20 hearts
  min-hearts: 10.5
  # Unranked hearts
  unranked-hearts: 10.0
  # Apply health on respawn
  apply-on-respawn: true
  # Custom hearts per rank (overrides linear interpolation if set)
  custom-hearts:
    1: 20.0
    2: 19.5
    3: 19.0
    4: 18.5
    5: 18.0
    6: 17.5
    7: 17.0
    8: 16.5
    9: 16.0
    10: 15.5
    11: 15.0
    12: 14.5
    13: 14.0
    14: 13.5
    15: 13.0
    16: 12.5
    17: 12.0
    18: 11.5
    19: 11.0
    20: 10.5
    0: 10.0

