# Dragon Egg Locator (Waypoint API / Locator Bar - 1.21.6+)
# Uses Minecraft's native Waypoint Attributes to render the client-side Locator Bar
# for any player carrying the Dragon Egg.
dragon-egg-locator:
  # Enable Dragon Egg Locator features
  enabled: true
  # Prevent storing Dragon Egg in containers
  # Blocks: chests, ender chests, barrels, shulker boxes, hoppers, extra inventory, etc.
  prevent-storage: true
  # Prevent dropping Dragon Egg (disabled by default)
  # When enabled, Dragon Egg cannot be dropped with Q key
  prevent-drop: false

