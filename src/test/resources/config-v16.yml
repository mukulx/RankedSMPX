# Rank Transfer Settings
# Note: For Discord integration settings, see discord.yml
rank-transfer:
  # Enable rank transfer feature
  enabled: false
  # Allow transferring to offline players
  allow-offline: false

# Tactical Orbital Strike System (/orbitalstrike, /strike, /os)
# Permission-based admin tactical strike artillery.
orbital-strike:
  # Enable orbital strike commands and dialogs
  enabled: true
  # Permission required to use orbital strike commands
  permission: "rankedsmp.orbitalstrike"
  # Height above target coordinate where TNT entities spawn in the sky
  spawn-height-offset: 45

  # Nuke Shot Settings (Expanding concentric TNT circles falling from the sky)
  nuke-shot:
    # Number of concentric expanding rings
    rings: 7
    # Distance between each ring
    ring-radius-step: 3.5
    # Fuse ticks before detonation (75 ticks = ~3.7 seconds)
    fuse-ticks: 75
    # Explosion power yield
    tnt-yield: 4.0
    # Whether explosions break terrain blocks
    break-blocks: true
    # Whether explosions ignite fire
    set-fire: false

  # Stab Shot Settings (Concentrated vertical drilling precision barrage)
  stab-shot:
    # Number of TNT dropped in vertical sequence
    tnt-count: 25
    # Fuse ticks before detonation
    fuse-ticks: 65
    # Explosion power yield
    tnt-yield: 4.0
    # Whether explosions break terrain blocks
    break-blocks: true
    # Whether explosions ignite fire
    set-fire: false

