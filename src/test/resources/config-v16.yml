# Season Settings
season:
  # Total number of ranks (1-20)
  total-ranks: 20

  # Rank stealing on player kill
  rank-stealing:
    enabled: true
    # Only allow stealing if rank difference is within this range (0 = unlimited)
    max-rank-difference: 0
    # Seconds a killer must wait after stealing a rank before they can steal again (0 = no cooldown)
    cooldown: 0

  # Visual effects on death
  death-effects:
    # Lightning strike at victim's location when killed in PvP
    lightning-on-kill: false

# Auto-Assign Remaining Ranks
# When the season starts, ranks are assigned only to players who are online.
# If there are leftover ranks (e.g. 20 ranks but only 15 players online),
# new players who join will automatically receive the remaining ranks
# with the same reveal animation and chat announcement.
auto-assign-ranks:
  enabled: true

