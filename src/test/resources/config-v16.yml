# LuckPerms Integration
# Optional integration to provide dynamic rank contexts in LuckPerms:
# - rankedsmp:rank (1-20, unranked, blacklisted)
# - rankedsmp:ranked (true, false)
# Allows server owners to assign permissions, meta prefixes, or groups based on rank in LuckPerms!
luckperms:
  # Enable LuckPerms integration (disabled by default)
  enabled: false
  # Register dynamic rank contexts with LuckPerms ContextManager
  register-contexts: true
  # Automatically signal LuckPerms to recalculate player permissions/meta on rank changes
  sync-on-rank-change: true

