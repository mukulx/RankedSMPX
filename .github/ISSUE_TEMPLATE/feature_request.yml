name: Feature Request
description: Suggest a new feature or enhancement for RankedSMPX
title: "[Feature] "
labels: ["enhancement", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please describe your idea below.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-Submission Checklist
      description: Please verify the following before submitting
      options:
        - label: I have checked existing issues and this feature hasn't been requested
          required: true
        - label: This feature fits within the scope of RankedSMPX
          required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear description of the feature you'd like to see
      placeholder: "Describe the feature in detail..."
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Why do you need it?
      placeholder: "Currently, I have to... and it would be better if..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: "The feature should work like this..."
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Describe specific scenarios where this feature would be useful
      placeholder: |
        1. When a player...
        2. During a season...
        3. For administrators...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative solutions or workarounds?
      placeholder: "I've tried... but it doesn't work well because..."

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature Type
      description: What type of feature is this?
      options:
        - New Command
        - New Game Mechanic
        - Discord Integration
        - Configuration Option
        - Quality of Life
        - Performance Improvement
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (Blocking my use of the plugin)
        - High (Would significantly improve my experience)
        - Medium (Nice to have)
        - Low (Minor improvement)
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any mockups, examples, or additional information
      placeholder: "Screenshots, diagrams, links to similar features in other plugins..."
