plugins {
    id 'java'
    id 'maven-publish'
}

group = 'dev.mukulx'
version = '3.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
}

// Override to compile-check against newer servers, e.g. -PpaperApi=26.2.build.+
def paperApi = findProperty('paperApi') ?: '1.21.11-R0.1-SNAPSHOT'
// Paper 26.x API is published for Java 25+; the shipped jar stays Java 21 (default 1.21.11 API).
def javaRelease = paperApi.startsWith('1.') ? 21 : 25

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApi}"
    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly 'com.github.NEZNAMY:TAB-API:6.0.0'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'io.netty:netty-all:4.1.100.Final'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    
    // Runtime dependencies resolved by PaperPluginLoader.
    compileOnly('net.dv8tion:JDA:6.4.1') {
        exclude module: 'opus-java'
    }
    compileOnly 'com.google.code.gson:gson:2.11.0'
    compileOnly 'com.mysql:mysql-connector-j:9.7.0'
    compileOnly 'org.xerial:sqlite-jdbc:3.53.0.0'
    compileOnly 'com.zaxxer:HikariCP:7.0.2'
    
    // Test dependencies (include runtime deps for testing)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.10.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'net.dv8tion:JDA:6.4.1'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'com.mysql:mysql-connector-j:9.7.0'
    testImplementation 'org.xerial:sqlite-jdbc:3.53.0.0'
    testImplementation 'com.zaxxer:HikariCP:7.0.2'
}

test {
    useJUnitPlatform()
    // HealthManagerTest requires a booted Paper server registry for Paper 1.21+ Attribute RegistryAccess
    exclude '**/HealthManagerTest*'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}


java {
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

jar {
    archiveBaseName.set('RankedSMPX')
    
    // Optimize JAR compression
    // Use maximum compression level (9) to reduce file size
    zip64 = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    
    // Add manifest attributes
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release.set(javaRelease)
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand(version: project.version)
    }
}

java {
    withSourcesJar()
}

// Published through JitPack so other plugins can depend on the API.
publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'RankedSMPX'
            from components.java
        }
    }
}
